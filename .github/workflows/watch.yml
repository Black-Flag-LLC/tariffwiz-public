name: tariff-watch
# Daily: new HTS revision, Federal Register notices (incl. public inspection) and CBP CSMS messages -> one "Tariff watch"
# issue (new items only), and the site's status banner (app/public/data/status.json: published actions not yet reviewed),
# redeployed whenever it changes. A new HTS revision starts the update job: rebuild the data, run tests + heading audit +
# Census check. When nothing in Chapter 99 moved and every check passes it is committed to main and goes live by itself;
# otherwise it waits on a branch (tariff-update/REV) with an issue saying what needs a person ("rule work needed"), and
# the banner tells users what isn't in the results yet.
on:
  # Twice a day. GitHub starts scheduled runs late here (5-6 hours is common) and may drop one, so a second slot keeps
  # "daily" true; a run with nothing new changes nothing (items already seen or reviewed are skipped).
  schedule:
    - cron: '17 14 * * *'   # 14:17 UTC: after the Federal Register's 06:00 ET issue and 08:45 ET public inspection
    - cron: '47 2 * * *'    # 02:47 UTC: after the day's late public-inspection filings
  workflow_dispatch:
    inputs:
      release:
        description: Run the update job for this HTS revision now (e.g. 2026HTSRev22); empty = only if the watch finds one
        type: string
        default: ''
      dry_run:
        description: With a release, run every step and show the result, but push nothing
        type: boolean
        default: false
      review_doc:
        description: Test the review job on this Federal Register document (e.g. 2026-22385), even if already reviewed; publishes nothing
        type: string
        default: ''
permissions:
  contents: read
concurrency: { group: data-writer, cancel-in-progress: false }   # every job that commits data to main queues here (rules.json is one line: parallel edits always conflict)
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write, issues: write, actions: write }
    outputs:
      new_revision: ${{ steps.w.outputs.new_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - name: Keep the scheduled workflows on
        # GitHub turns off schedules in a public repo after 60 days with no activity; quiet months are normal here
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for w in watch.yml adcvd.yml census.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable" || echo "::warning::could not re-enable $w"
          done
      - name: Collect what earlier watch issues already reported
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          touch seen.txt
          for n in $(gh issue list --state all --search '"Tariff watch" in:title' --limit 10 --json number -q '.[].number'); do
            gh issue view "$n" --json body,comments -q '.body, .comments[].body' >> seen.txt
          done
      - id: w
        run: |
          set +e
          python -I pipeline/watch.py --seen seen.txt --json watch.json --status app/public/data/status.json > report.md; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md
          if [ -f watch.json ]; then echo "new_revision=$(jq -r '.new_revision // ""' watch.json)" >> "$GITHUB_OUTPUT"; fi
      - if: steps.w.outputs.code == '2'
        run: exit 1   # the check itself failed (network/API), don't open an empty issue
      - if: steps.w.outputs.code == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          title="Tariff watch: changes to review"
          n=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file report.md; else gh issue create --title "$title" --body-file report.md; fi
      - if: steps.w.outputs.code != '2'
        name: Publish the status banner when it changed
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # nothing published since the rules' check date is unreviewed: the rules are checked as of today ("rules
          # checked" on the site). The review job does the same after it clears the banner.
          if [ "$(jq '.pending | length' app/public/data/status.json)" = 0 ] \
             && [ "$(jq -r .meta.checked app/public/data/rules.json)" != "$(python -I -c 'import datetime; print(datetime.date.today())')" ]; then
            python -I pipeline/mark_reviewed.py --checked
            python -I pipeline/watch.py --json /dev/null --status app/public/data/status.json > /dev/null || true
          fi
          if git diff --quiet app/public/data/status.json app/public/data/rules.json; then echo "Status unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/status.json app/public/data/rules.json
          git commit -qm "Status: $(jq '.pending | length' app/public/data/status.json) unreviewed tariff action(s); rules checked $(jq -r .meta.checked app/public/data/rules.json)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
          gh workflow run ci.yml -f deploy=true   # a GITHUB_TOKEN push does not trigger ci by itself

  update:
    needs: watch
    if: needs.watch.outputs.new_revision != '' || (inputs.release || '') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: write, actions: write }
    env:
      REL: ${{ inputs.release || needs.watch.outputs.new_revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }   # the watch job may just have pushed a status commit
      - id: seen
        name: Skip a revision that already has an update branch (unless run by hand)
        run: |
          if [ -z "${{ inputs.release }}" ] && git ls-remote --exit-code --heads origin "tariff-update/$REL" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "tariff-update/$REL already exists and waits for review; nothing to do."
          fi
      - if: steps.seen.outputs.skip != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - if: steps.seen.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - id: build
        if: steps.seen.outputs.skip != 'true'
        name: Fetch and rebuild the HTS data
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq poppler-utils; }
          pip install -q 'pymupdf>=1.24'
          python -I pipeline/fetch_hts.py --release "$REL"
          python -I pipeline/build_hts.py
          d="data/raw/usitc/revisions/$REL"
          pdftotext -layout -enc UTF-8 "$d/Change_Record.pdf" data/build/change_record.txt || rm -f data/build/change_record.txt
          python -I pipeline/shaded_headings.py --pdf "$d/Chapter_99.pdf" --out data/build/shaded_new.json
          python -I pipeline/update_hts.py --release "$REL" --shaded data/build/shaded_new.json \
            --change-record data/build/change_record.txt --apply
          echo "changed=$(jq -r .changed data/build/update_status.json)" >> "$GITHUB_OUTPUT"
          echo "rules=$(jq -r .needs_rule_work data/build/update_status.json)" >> "$GITHUB_OUTPUT"
          # the banner names the revision the data is built from: refresh it with the new one (best effort; the next watch does it too)
          python -I pipeline/watch.py --json /dev/null --status app/public/data/status.json > /dev/null || true
      - id: checks
        if: steps.build.outputs.changed == 'true' || (inputs.dry_run && steps.build.outputs.changed != '')
        name: Tests, heading audit and Census check on the new data
        working-directory: app
        env: { NO_COLOR: '1', FORCE_COLOR: '0' }   # plain text, so the counts can be read from the logs
        run: |
          set +e
          npm ci --no-audit --no-fund
          ok=true
          npx vitest run > ../data/build/vitest.txt 2>&1 || ok=false
          npm run audit:headings > ../data/build/audit.txt 2>&1 || ok=false
          m=$(python -I ../pipeline/census_gate.py latest)
          {
            echo "### Checks on the new data"; echo
            t=$(grep -E 'Tests +[0-9]' ../data/build/vitest.txt | tr -s ' '); a=$(grep -E 'violation shapes' ../data/build/audit.txt | tail -n 1)
            echo "- Golden tests: ${t:-did not run}"
            echo "- Heading audit: ${a:-did not finish}"; echo
          } > ../data/build/checks.md
          if [ -n "$m" ] && npx tsx scripts/validate_census.ts --month "$m" > ../data/build/census.txt 2>&1; then
            python -I ../pipeline/census_gate.py check "../data/validation/census_20${m:0:2}-${m:2:2}_summary.json" >> ../data/build/checks.md || ok=false
          else
            echo "Census check did not run (month '${m}'): see the workflow log." >> ../data/build/checks.md; ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          cat ../data/build/checks.md
          if [ "$ok" != true ]; then { echo; echo "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } >> ../data/build/checks.md; fi
      - if: steps.build.outputs.changed == 'true' || (inputs.dry_run && steps.build.outputs.changed != '')
        name: Go live, or hold for review
        run: |
          hold=""; title="HTS $REL: automatic data update"
          if [ "${{ steps.build.outputs.rules }}" = true ]; then hold=1; title="$title (rule work needed)"; fi
          if [ "${{ steps.checks.outputs.ok }}" != true ]; then hold=1; title="$title (checks failed)"; fi
          { cat data/build/update_report.md; echo; cat data/build/checks.md; echo; echo "---"; } > pr.md
          if [ "${{ inputs.dry_run }}" = true ]; then { echo "# Dry run: $title"; cat pr.md; } >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data
          git commit -qm "HTS $REL: automatic data update" -m "$(jq -r '.reasons | join("; ")' data/build/update_status.json)"
          if [ -z "$hold" ]; then
            # nothing in Chapter 99 moved and every check passed: take it live without waiting for a person
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh workflow run ci.yml -f deploy=true
            { echo "# $title: live"; cat pr.md; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push -q --force origin "HEAD:refs/heads/tariff-update/$REL"
          echo "Opened by the tariff-watch workflow. Merging puts this data live (the ci workflow deploys main)." >> pr.md
          if ! gh pr create --draft --base main --head "tariff-update/$REL" --title "$title" --body-file pr.md; then
            # Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" is off
            { echo "The data is on branch tariff-update/$REL. Open the pull request here:"
              echo "${{ github.server_url }}/${{ github.repository }}/compare/main...tariff-update/$REL"; echo; cat pr.md; } > note.md
            gh issue create --title "$title" --body-file note.md
          fi
      - if: steps.build.outputs.changed == 'false' && !inputs.dry_run
        run: echo "The rebuilt data equals what is in main; nothing to do."

  review:
    # Claude reads each unreviewed Federal Register action on the banner (.github/review/prompt.md). "No change to any duty"
    # is recorded in pipeline/reviewed.json and goes live; an encoded rule change, or one it cannot settle, waits on a
    # review/DOC branch with an issue for a person. Once nothing is left unreviewed, rules.json meta.checked moves to today.
    # Needs the secret ANTHROPIC_API_KEY; without it the banner simply keeps listing the actions.
    needs: [watch, update]
    if: always() && needs.watch.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write, issues: write, pull-requests: write, actions: write }
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
      BUDGET: ${{ vars.REVIEW_BUDGET_USD || '3' }}     # per document, US dollars
      MAX_DOCS: ${{ vars.REVIEW_MAX_DOCS || '6' }}     # per run; the rest wait for tomorrow
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so nothing was reviewed. Review by hand with pipeline/mark_reviewed.py."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }   # no git credentials while Claude runs
      - id: todo
        if: env.HAS_KEY == 'true'
        name: Pick the actions to review (skip those already held on a review/ branch)
        env: { TEST_DOC: '${{ inputs.review_doc }}' }
        run: |
          mkdir -p data/build/review
          git ls-remote --heads "https://github.com/${{ github.repository }}" 'review/*' | sed 's#.*refs/heads/review/##' > data/build/review/held.txt
          jq -r '.pending[].doc' app/public/data/status.json | tr -d '\r' | grep -E '^[0-9]{4}-[0-9]+$' \
            | grep -vxF -f data/build/review/held.txt | head -n "$MAX_DOCS" > data/build/review/todo.txt || true
          if [ -n "$TEST_DOC" ]; then   # test run: just this document, as if unreviewed (nothing is published)
            echo "$TEST_DOC" | grep -E '^[0-9]{4}-[0-9]+$' > data/build/review/todo.txt || { echo "::error::bad document number"; exit 1; }
            jq --arg d "$TEST_DOC" '.reviewed |= map(select(.doc != $d))' pipeline/reviewed.json > data/build/review/r.json
            mv data/build/review/r.json pipeline/reviewed.json
            git -c user.name=test -c user.email=test@example.invalid commit -qam "test: treat $TEST_DOC as unreviewed"   # local only
          fi
          echo "count=$(wc -l < data/build/review/todo.txt)" >> "$GITHUB_OUTPUT"
          echo "To review:"; cat data/build/review/todo.txt
      - if: steps.todo.outputs.count > 0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - if: steps.todo.outputs.count > 0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - if: steps.todo.outputs.count > 0
        name: Review each action with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NO_COLOR: '1'
        run: |
          npm ci --prefix app --no-audit --no-fund > /dev/null
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.317 > /dev/null
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          R=data/build/review; RULES=app/public/data/rules.json
          rules() {  # pretty for editing, compact (the pipeline's exact format) for commits
            python -I -c "import json,sys; p=sys.argv[2]; r=json.load(open(p,encoding='utf-8')); open(p,'w',encoding='utf-8').write(json.dumps(r,indent=1,ensure_ascii=False) if sys.argv[1]=='pretty' else json.dumps(r,separators=(',',':')))" "$1" "$RULES"
          }
          fulltext() {  # the document's verbatim text (Claude's WebFetch only returns a summary): published, else on inspection
            local doc=$1 j u
            for api in documents public-inspection-documents; do
              j=$(curl -sfL --retry 3 --retry-all-errors "https://www.federalregister.gov/api/v1/$api/$doc.json") || continue
              u=$(jq -r '.raw_text_url // empty' <<<"$j")
              if [ -n "$u" ] && curl -sfL --retry 3 --retry-all-errors "$u" -o "$R/$doc.txt" && [ -s "$R/$doc.txt" ]; then return 0; fi
              u=$(jq -r '.pdf_url // empty' <<<"$j")
              if [ -n "$u" ] && curl -sfL --retry 3 --retry-all-errors "$u" -o "$R/$doc.pdf"; then
                command -v pdftotext >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq poppler-utils; } > /dev/null
                pdftotext -layout -enc UTF-8 "$R/$doc.pdf" "$R/$doc.txt" && [ -s "$R/$doc.txt" ] && return 0
              fi
            done
            rm -f "$R/$doc.txt"; return 1
          }
          : > "$R/live.txt"; : > "$R/held_new.txt"
          while read -r doc; do
            [ -n "$doc" ] || continue
            git checkout -q main
            jq --arg d "$doc" '.pending[] | select(.doc == $d)' app/public/data/status.json > "$R/item.json"
            [ -s "$R/item.json" ] || jq -n --arg d "$doc" '{doc: $d, note: "test run: not on the banner"}' > "$R/item.json"
            fulltext "$doc" || echo "::warning::no full text for $doc"
            rules pretty
            sed "s/{{DOC}}/$doc/g" .github/review/prompt.md > "$R/prompt.txt"
            echo "::group::Claude on $doc"
            claude -p "$(cat "$R/prompt.txt")" --model "$MODEL" --max-budget-usd "$BUDGET" --permission-mode dontAsk \
              --tools Read Edit Write Glob Grep Bash WebFetch \
              --allowedTools Read Edit Write Glob Grep \
                "Bash(python -I pipeline/mark_reviewed.py:*)" "Bash(npm --prefix app test:*)" \
                "Bash(npm --prefix app run audit:headings:*)" "Bash(npm --prefix app run quote:*)" \
                "WebFetch(domain:www.federalregister.gov)" "WebFetch(domain:public-inspection.federalregister.gov)" \
                "WebFetch(domain:www.govinfo.gov)" "WebFetch(domain:hts.usitc.gov)" \
              < /dev/null 2>&1 | tee "$R/$doc.log" || true
            echo "::endgroup::"
            decision=$(jq -r '.decision // empty' "$R/$doc.json" 2>/dev/null || true); summary=$(jq -r '.summary // empty' "$R/$doc.json" 2>/dev/null || true)
            [ -n "$decision" ] || { decision=needs_person; summary="The review did not finish with a decision (see the workflow log)."; }
            if ! rules compact; then git checkout -q -- "$RULES"; decision=needs_person; summary="$summary (rules.json was left invalid; edit discarded)"; fi
            others=$(git status --porcelain | grep -v ' pipeline/reviewed.json$' || true)
            recorded=$(jq --arg d "$doc" 'any(.reviewed[]; .doc == $d)' pipeline/reviewed.json)
            if [ "$decision" = no_change ] && [ -z "$others" ] && [ "$recorded" = true ]; then
              git add pipeline/reviewed.json
              git commit -qm "Review $doc: no duty change" -m "$summary"
              echo "$doc" >> "$R/live.txt"
            else
              [ "$decision" != no_change ] || { decision=needs_person; summary="$summary (said no change but did not record only that)"; }
              if ! git checkout -q -b "review/$doc"; then   # never let a held review land on main
                echo "::error::could not create branch review/$doc; leaving $doc unreviewed"
                git checkout -q -f main; git clean -qfd -- app pipeline; continue
              fi
              { echo "decision: $decision"; echo; echo "$summary"; } > "$R/$doc.md"
              if [ -n "$others" ]; then
                { echo; echo "### Checks on this branch"; echo; echo '```'
                  npm --prefix app test 2>&1 | grep -E 'Tests +[0-9]|FAIL' | tail -n 5 || true
                  npm --prefix app run audit:headings 2>&1 | grep -E 'violation shapes' | tail -n 1 || true
                  echo '```'; } >> "$R/$doc.md"
              fi
              git add -A
              git commit -q --allow-empty -m "Review $doc: $decision" -m "$summary"
              echo "$doc $decision" >> "$R/held_new.txt"
              git checkout -q main
            fi
          done < "$R/todo.txt"
      - if: steps.todo.outputs.count > 0 && inputs.review_doc != ''
        name: Test run result (nothing published)
        run: |
          R=data/build/review; d="${{ inputs.review_doc }}"
          { echo "## Review test: $d"; echo; echo "Full text fetched: $([ -s "$R/$d.txt" ] && echo "yes, $(wc -c < "$R/$d.txt") bytes" || echo no)"; echo
            echo '```json'; cat "$R/$d.json" 2>/dev/null || echo "no decision file"; echo '```'; echo
            echo "Would go: $(grep -qx "$d" "$R/live.txt" && echo "live (main)" || echo "held: $(grep "^$d " "$R/held_new.txt" | cut -d' ' -f2-)")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.todo.outputs.count > 0 && inputs.review_doc == ''
        name: Publish the reviews
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          R=data/build/review
          gh auth setup-git
          # the banner and meta.checked: once nothing published since the check date is unreviewed, move the date
          python -I pipeline/watch.py --json /dev/null --status app/public/data/status.json > /dev/null || true
          if [ "$(jq '.pending | length' app/public/data/status.json)" = 0 ]; then
            python -I pipeline/mark_reviewed.py --checked
            python -I pipeline/watch.py --json /dev/null --status app/public/data/status.json > /dev/null || true
          fi
          git add app/public/data/status.json app/public/data/rules.json
          git diff --cached --quiet || git commit -qm "Status: $(jq '.pending | length' app/public/data/status.json) unreviewed tariff action(s)"
          if [ "$(git rev-list --count origin/main..main)" -gt 0 ]; then
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh workflow run ci.yml -f deploy=true
          fi
          while read -r doc decision; do
            [ -n "$doc" ] || continue
            git push -q --force origin "review/$doc"
            title="Review $doc: $decision"
            { cat "$R/$doc.md"; echo; echo "Federal Register: $(jq -r --arg d "$doc" '.pending[] | select(.doc == $d) | .url' app/public/data/status.json)"
              echo; echo "Branch: [review/$doc](${{ github.server_url }}/${{ github.repository }}/compare/main...review/$doc). Merging it records the review"
              echo "(and any encoded rule change) and takes it live. Deleting the branch lets the next daily run review it again."
              echo; echo "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > "$R/$doc.issue.md"
            gh issue create --title "$title" --body-file "$R/$doc.issue.md"
          done < "$R/held_new.txt"
          { echo "## Reviews"; echo; echo "Live: $(paste -sd ' ' "$R/live.txt")"; echo; echo "Held: $(cut -d' ' -f1 "$R/held_new.txt" | paste -sd ' ')"; } >> "$GITHUB_STEP_SUMMARY"
