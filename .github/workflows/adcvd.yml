name: adcvd-refresh
# Monthly: rebuild the AD/CVD order flags from the Federal Register (pipeline/update_adcvd.py). When orders changed and
# the tests and heading audit pass, it is committed to main and goes live by itself; otherwise it waits on a branch
# (adcvd-refresh/YYYY-MM) with an issue for review.
on:
  schedule: [{ cron: '41 11 3 * *' }]   # 3rd of each month, 11:41 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: data-writer, cancel-in-progress: false }   # shared with tariff-watch: both commit rules.json
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # ~1,750 Federal Register calls; rate-limit waits (429) can add a lot
    permissions: { contents: write, pull-requests: write, issues: write, actions: write }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - id: r
        run: |
          python -I pipeline/update_adcvd.py --status adcvd_report.json
          if git diff --quiet app/public/data/rules.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - id: checks
        if: steps.r.outputs.changed == 'true'
        working-directory: app
        env: { NO_COLOR: '1', FORCE_COLOR: '0' }
        run: |
          set +e
          npm ci --no-audit --no-fund
          ok=true
          npm test > ../test.txt 2>&1 || ok=false
          npm run audit:headings > ../audit.txt 2>&1 || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          tail -n 3 ../test.txt ../audit.txt
      - if: steps.r.outputs.changed == 'true'
        name: Go live (held only if a check fails)
        run: |
          month=$(date -u +%Y-%m)
          branch="adcvd-refresh/$month"; title="AD/CVD order flags refreshed ($month)"
          { echo "## $title"; echo; echo '```json'; cat adcvd_report.json; echo '```'; echo
            echo "- Golden tests: $(grep -E 'Tests +[0-9]' test.txt | tr -s ' ')"
            echo "- Heading audit: $(grep -E 'violation shapes' audit.txt | tail -n 1)"; echo
            echo "Opened by the adcvd-refresh workflow."; } > pr.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.json-rules.driver "python -I pipeline/json_merge.py %O %A %B"   # rules.json merges as JSON (.gitattributes)
          git config merge.keep-ours.driver true   # status.json: keep main's (.gitattributes)
          git add app/public/data/rules.json
          git commit -qm "$title"
          hold=""; [ "${{ steps.checks.outputs.ok }}" = true ] || hold="checks failed"
          # no count limit on removals: update_adcvd.py removes an order only with a revocation notice behind it
          if [ -z "$hold" ]; then
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh workflow run ci.yml -f deploy=true   # a GITHUB_TOKEN push does not trigger ci by itself
            cat pr.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push -q --force origin "HEAD:refs/heads/$branch"
          if ! gh pr create --draft --base main --head "$branch" --title "$title ($hold)" --body-file pr.md; then
            { echo "Held for review ($hold). The data is on branch $branch. Open the pull request here:"
              echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$branch"; echo; cat pr.md; } > note.md
            gh issue create --title "$title: held for review" --body-file note.md
          fi
