name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (needs the repo public with Pages on)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -q ruff==0.17.3 && ruff check pipeline   # ruff.toml
  test-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint            # oxlint, warnings fail
      - run: npm run typecheck       # app, tests and scripts
      - run: npm test                # golden tests gate every build
      - run: npm run audit:headings  # every list a code is on files one of its Chapter 99 headings, on every answer path
      - run: npx vite build          # tsc -b already ran in typecheck
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4 (pins its own upload-artifact by SHA)
        with: { path: app/dist }
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
