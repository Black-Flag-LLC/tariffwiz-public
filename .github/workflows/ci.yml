name: ci
# Lint, typecheck, golden tests and the heading audit gate every build; a build of main that passes goes live on
# GitHub Pages. The data jobs (watch, adcvd-refresh) push with GITHUB_TOKEN, which does not fire `push`, so they start
# this workflow with `gh workflow run ci.yml -f deploy=true` after they commit.
#
# One run per branch at a time, and a newer run cancels an older one: otherwise two runs of main started a minute apart
# can finish out of order and the older build deploys over the newer one. The newer run carries every older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy main to GitHub Pages after the checks pass
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.11' }
      - run: pip install -q ruff==0.17.3 && ruff check pipeline   # ruff.toml
      - run: python -I pipeline/improve_gate.py selftest   # the self-improve gate still refuses what it must
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint            # oxlint, warnings fail
      - run: npm run typecheck       # app, tests and scripts
      - run: npm test                # golden tests gate every build
      - run: npm run audit:headings  # every list a code is on files one of its Chapter 99 headings, on every answer path
      - run: npx vite build          # tsc -b already ran in typecheck
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v4 (pins its own upload-artifact by SHA)
        with: { path: app/dist }
  lighthouse:
    # The built site as a phone: performance (median of 3 runs) at least 90, accessibility and best practices 100
    # (app/scripts/lighthouse.ts). A drop shows as a failed check and an email; it does not hold back the deploy, so a
    # data update never waits on a timing measurement. Theme contrast is checked in the tests (src/themes.test.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx vite build
      - run: npm run lighthouse
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: [lint-python, test-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
