name: publish
# After every push to main (including a merged tariff-update pull request): mirror the shippable files into the public
# copy (publish_public.sh) and, once GitHub Pages is on for that copy, redeploy the site.
# Needs the secret PUBLIC_REPO_TOKEN: a fine-grained token (resource owner Black-Flag-LLC, approved by an org admin, at most
# 366 days) on Black-Flag-LLC/tariffwiz-public with Contents, Workflows (the sync
# copies .github/workflows) and Actions all read/write. Without it the job only prints a notice (sync by hand with
# publish_public.sh). The preflight step names the missing access: seeing the repo needs only repository access,
# cloning needs Contents.
on:
  push:
    branches: [main]
    paths: ['app/**', 'pipeline/**', '.github/**', 'publish_public.sh', 'README.md', 'ruff.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    if: github.repository == 'Black-Flag-LLC/tariffwiz'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      - if: env.GH_TOKEN == ''
        run: echo "::notice::PUBLIC_REPO_TOKEN is not set; the public copy was not synced. Run publish_public.sh by hand."
      - if: env.GH_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }   # else git sends this repo's GITHUB_TOKEN to tariffwiz-public: 403
      - if: env.GH_TOKEN != ''
        name: Check the token can reach the public copy
        run: |
          gh api repos/Black-Flag-LLC/tariffwiz-public -q '"token permissions on tariffwiz-public: \(.permissions)"' \
            || { echo "::error::PUBLIC_REPO_TOKEN cannot see Black-Flag-LLC/tariffwiz-public (repository access)"; exit 1; }
          git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/Black-Flag-LLC/tariffwiz-public.git" HEAD >/dev/null \
            || { echo "::error::PUBLIC_REPO_TOKEN cannot read the public copy over git (Contents permission)"; exit 1; }
      - if: env.GH_TOKEN != ''
        name: Sync the public copy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash publish_public.sh "Sync: $(git log -1 --format=%s)"
      - if: env.GH_TOKEN != ''
        name: Redeploy the site (only once it is live; the first deploy is part of launch)
        run: |
          # the token has no Pages permission, so ask the site itself: 200 once the first deploy has happened
          if [ "$(curl -s --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' https://black-flag-llc.github.io/tariffwiz-public/)" = 200 ]; then
            gh workflow run ci.yml -R Black-Flag-LLC/tariffwiz-public -f deploy=true
          else
            echo "GitHub Pages is not on for the public copy yet (pre-launch): synced, not deployed."
          fi
